<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WESTERN ESTATE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800;900&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #f6f4ef;
    --line: rgba(24, 24, 27, 0.055);
    --line-major: rgba(24, 24, 27, 0.11);
    --ink: #141416;
    --card-bg: #ffffff;
    --card-border: rgba(24, 24, 27, 0.09);
    --shadow: 0 18px 40px rgba(20, 20, 22, 0.06);
    --shadow-hover: 0 28px 56px rgba(20, 20, 22, 0.13);
    --radius: 22px;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    min-height: 100%;
    width: 100%;
    overflow-x: hidden;
  }

  body {
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background-color: var(--bg);
    color: var(--ink);
    background-image:
      linear-gradient(to right, var(--line) 1px, transparent 1px),
      linear-gradient(to bottom, var(--line) 1px, transparent 1px),
      linear-gradient(to right, var(--line-major) 1px, transparent 1px),
      linear-gradient(to bottom, var(--line-major) 1px, transparent 1px);
    background-size: 28px 28px, 28px 28px, 140px 140px, 140px 140px;
    background-position: center center;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
  }

  .stage {
    width: 100%;
    max-width: 1120px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 54px;
  }

  .wordmark {
    font-weight: 900;
    font-size: clamp(32px, 6.2vw, 68px);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink);
    text-align: center;
    line-height: 1.05;
    padding-left: 0.18em;
    user-select: none;
  }

  .cards {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 28px;
  }

  .card {
    display: block;
    aspect-ratio: 4 / 3;
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    box-shadow: var(--shadow);
    transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
                box-shadow 0.35s cubic-bezier(0.22, 1, 0.36, 1),
                border-color 0.35s ease;
    position: relative;
  }

  .card:hover {
    transform: translateY(-8px);
    box-shadow: var(--shadow-hover);
    border-color: rgba(24, 24, 27, 0.22);
  }

  .card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .card:hover img {
    transform: scale(1.04);
  }

  @media (max-width: 860px) {
    body {
      padding: 40px 20px;
    }

    .stage {
      gap: 40px;
    }

    .cards {
      grid-template-columns: 1fr;
      max-width: 440px;
      gap: 22px;
    }
  }
</style>
</head>

<body>
  <main class="stage">
    <div class="wordmark">WESTERN ESTATE</div>

    <div class="cards">
      <a class="card" href="https://westernestate.in/ironclad">
        <img src="excavator.jpg" alt="">
      </a>

      <a class="card" href="https://westernestate.in/analytics">
        <img src="software.jpg" alt="">
      </a>

      <a class="card" href="https://farm.westernestate.in">
        <img src="farm.jpg" alt="">
      </a>
    </div>
  </main>
</body>
</html>
