<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WESTERN ESTATE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;800;900&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #f6f4ef;
    --line: rgba(24, 24, 27, 0.055);
    --line-major: rgba(24, 24, 27, 0.11);
    --ink: #141416;
    --muted: #57575f;
    --subtle: #8c8c96;
    --card-bg: #ffffff;
    --card-border: rgba(24, 24, 27, 0.09);
    --shadow: 0 18px 40px rgba(20, 20, 22, 0.06);
    --shadow-hover: 0 28px 56px rgba(20, 20, 22, 0.13);
    --radius: 22px;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    min-height: 100%;
    width: 100%;
    overflow-x: hidden;
  }

  body {
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background-color: var(--bg);
    color: var(--ink);
    background-image:
      linear-gradient(to right, var(--line) 1px, transparent 1px),
      linear-gradient(to bottom, var(--line) 1px, transparent 1px),
      linear-gradient(to right, var(--line-major) 1px, transparent 1px),
      linear-gradient(to bottom, var(--line-major) 1px, transparent 1px);
    background-size: 28px 28px, 28px 28px, 140px 140px, 140px 140px;
    background-position: center center;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: 56px 24px 18px;
    gap: 48px;
  }

  .stage {
    width: 100%;
    max-width: 1120px;
    margin: auto 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 50px;
  }

  .header-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .wordmark {
    font-weight: 900;
    font-size: clamp(32px, 6.2vw, 68px);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink);
    text-align: center;
    line-height: 1.05;
    padding-left: 0.18em;
    user-select: none;
  }

  .sublines {
    font-weight: 600;
    font-size: clamp(13px, 1.5vw, 15px);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: center;
    user-select: none;
  }

  .cards {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 28px;
  }

  .card {
    display: block;
    aspect-ratio: 4 / 3;
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    box-shadow: var(--shadow);
    transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
                box-shadow 0.35s cubic-bezier(0.22, 1, 0.36, 1),
                border-color 0.35s ease;
    position: relative;
  }

  .card:hover {
    transform: translateY(-8px);
    box-shadow: var(--shadow-hover);
    border-color: rgba(24, 24, 27, 0.22);
  }

  .card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .card:hover img {
    transform: scale(1.04);
  }

  .footer-notes {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 28px;
    text-align: center;
    font-size: 13.5px;
    font-weight: 500;
    color: var(--muted);
    line-height: 1.55;
  }

  .footer-notes a {
    color: inherit;
    text-decoration: none;
    transition: color 0.2s ease;
  }

  .footer-notes a:hover {
    color: var(--ink);
  }

  .legal-tiny {
    font-size: 10px;
    font-weight: 500;
    color: var(--subtle);
    text-align: center;
    letter-spacing: 0.04em;
    user-select: none;
  }

  @media (max-width: 860px) {
    body {
      padding: 40px 20px 16px;
      gap: 36px;
    }

    .stage {
      gap: 38px;
    }

    .cards,
    .footer-notes {
      grid-template-columns: 1fr;
      max-width: 440px;
      gap: 20px;
    }

    .footer-notes {
      gap: 10px;
    }
  }
</style>
</head>

<body>
  <main class="stage">
    <div class="header-block">
      <div class="wordmark">WESTERN ESTATE</div>
      <div class="sublines">Infrastructure &nbsp;|&nbsp; Software &nbsp;|&nbsp; Agriculture</div>
    </div>

    <div class="cards">
      <a class="card" href="https://westernestate.in/ironclad">
        <img src="excavator.jpg" alt="">
      </a>

      <a class="card" href="https://westernestate.in/analytics">
        <img src="software.jpg" alt="">
      </a>

      <a class="card" href="https://farm.westernestate.in">
        <img src="farm.jpg" alt="">
      </a>
    </div>

    <div class="footer-notes">
      <a href="https://westernestate.in/ironclad">Heavy Duty Civil &amp; Infrastructure solutions. Click to visit.</a>
      <a href="https://westernestate.in/analytics">Complex Administration Managment software solutions. Click to visit.</a>
      <a href="https://farm.westernestate.in">Agriculture, Agro tourism learning &amp; activities. Click to visit.</a>
    </div>
  </main>

  <footer class="legal-tiny">© 2024 Western Estate. All rights reserved.</footer>
</body>
</html>
